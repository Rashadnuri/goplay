# KataGo analysis-engine config for GO PLAY (see https://github.com/lightvector/KataGo/blob/master/cpp/configs/analysis_example.cfg)
# The service expects Black-relative numbers:
reportAnalysisWinratesAs = BLACK

logAllGTPCommunication = false
logSearchInfo = false
logToStderr = true

# Concurrency: tune to your hardware. 1 GPU: numAnalysisThreads≈2-4, numSearchThreadsPerAnalysisThread≈4-8.
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 4
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16

# Report ownership & policy only when asked
analysisPVLen = 8
maxVisits = 1000
